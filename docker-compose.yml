services:
  server:
    image: ghcr.io/blendminh/niganigar-server:latest
    environment:
      PORT: "3001"
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      VITE_DISCORD_CLIENT_ID: ${VITE_DISCORD_CLIENT_ID}
      CORS_ORIGIN: https://hopeful-sure-owl.ngrok-free.app
    # yt-dlp cookies, used to get past YouTube's bot-detection block on
    # cloud IP ranges. Mounted as a file, not an env var — a real cookies
    # file is large enough to blow past the OS's exec() argument+env size
    # limit if passed as an env var (fails with "argument list too long").
    # Must be read-write: yt-dlp rewrites the cookie jar after every run to
    # persist rotated session cookies, and crashes if it can't.
    #
    # music-cache is bind-mounted too — without this it lives in the
    # container's writable layer and gets wiped on every recreate, which
    # is wasteful given how flaky yt-dlp downloads can be (forces a fresh
    # re-download of every song after every deploy/restart otherwise).
    volumes:
      - /home/ec2-user/yt-dlp-cookies.txt:/app/yt-dlp-cookies.txt
      - ./music-cache:/app/music-cache
    restart: unless-stopped

  client:
    image: ghcr.io/blendminh/niganigar-client:latest
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - client
      - server
    restart: unless-stopped
